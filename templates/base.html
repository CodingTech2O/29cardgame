<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>document.documentElement.classList.add("js")</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f4a2f">
    <title>29</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230f4a2f'/%3E%3Ctext x='50' y='72' font-size='64' text-anchor='middle' fill='%23f2cb6b'%3E%E2%99%A0%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/style.css') }}">
    <script src="{{ url_for('static', filename='JS/app.js') }}" defer></script>
</head>
<body{% if replay %} class="is-replaying"{% endif %}>
    <div class="bg-suits" aria-hidden="true">
        <span style="--x: 5%;  --y: 10%; --s: 6rem;   --d: 0s">&spades;</span>
        <span style="--x: 86%; --y: 14%; --s: 5rem;   --d: -5s">&hearts;</span>
        <span style="--x: 12%; --y: 70%; --s: 5.5rem; --d: -9s">&diams;</span>
        <span style="--x: 82%; --y: 74%; --s: 6.5rem; --d: -13s">&clubs;</span>
        <span style="--x: 48%; --y: 90%; --s: 4rem;   --d: -7s">&spades;</span>
    </div>

    <div class="table">
        <header class="masthead">
            <h1>29</h1>
            <p class="tagline">Trick-taking for four</p>
        </header>
        <main>
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
